[global]
  server multi channel support = yes
  server max protocol = SMB3_11
  server smb3 signing algorithms = AES-128-GMAC, AES-128-CMAC, HMAC-SHA256
  server smb3 encryption algorithms = AES-256-GCM, AES-128-GCM, AES-128-CCM

[tmp1]
  path = /tmp/tmp1
  read only = no

[tmp2]
  path = /tmp/tmp2
  read only = yes

# Owned by the disposable Linux CI runner; ordinary tmp1/tmp2 tests stay separate.
[multichannel-plain1]
  path = /tmp/smb2-multichannel/plain1
  read only = no

[multichannel-plain2]
  path = /tmp/smb2-multichannel/plain2
  read only = no

[multichannel-encrypted1]
  path = /tmp/smb2-multichannel/encrypted1
  read only = no
  smb encrypt = required

[multichannel-encrypted2]
  path = /tmp/smb2-multichannel/encrypted2
  read only = no
  smb encrypt = required
